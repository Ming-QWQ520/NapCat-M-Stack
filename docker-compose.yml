# NapCat-M Stack：单容器一体化部署
#
#   docker compose up -d --build
#   浏览器打开 http://<主机>:6185
#     /          AstrBot WebUI（填 API Key / 人格 / 插件）
#     /napcat    NapCat WebUI（QQ 扫码登录 / 协议配置）
#
# 只暴露 6185 一个端口；NapCat WebUI 绑定容器内 127.0.0.1，经统一网关代理。
services:
  napcat-m-stack:
    build:
      context: .
      args:
        # NapCat-M Shell 版本（与 NapCatQQ-M Release 对应）
        NAPCAT_VERSION: v4.18.43
        # 网络受限时指向镜像源，例如
        # NAPCAT_ZIP_URL: https://ghproxy.example.com/https://github.com/Ming-QWQ520/NapCatQQ-M/releases/download/v4.18.43/NapCat.Shell.zip
        NAPCAT_ZIP_URL: ""
    image: napcat-m-stack:latest
    container_name: napcat-m-stack
    restart: unless-stopped
    ports:
      - "6185:6185"          # 唯一对外端口：AstrBot + NapCat 双 WebUI
    environment:
      - TZ=Asia/Shanghai
      # 可选：预先指定 QQ 号（登录过一次后可自动快速登录）
      - ACCOUNT=${NAPCAT_ACCOUNT:-}
      # 与宿主机用户一致的 uid/gid，避免挂载目录权限问题（Linux 推荐）
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
    volumes:
      # AstrBot 数据 + NapCat 配置（统一持久化目录）
      - ./data:/app/data
      # QQ 登录态（重启无需重新扫码）
      - ./data/qq:/app/.config/QQ
